<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SkillVerify AI</title>

    <link rel="stylesheet" href="auth.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">

        <!-- LEFT SIDE -->

        <div class="left-panel">

            <div class="brand">
                <h1>SkillVerify AI</h1>
                <p>AI Powered Skill Verification</p>
            </div>

            <div class="left-content">
                <h2>
                    Start Your <br>
                    <span>Learning Journey</span>
                </h2>

                <p>
                    Create your account and unlock the power
                    of AI-driven skill verification.
                </p>
            </div>

        </div>

        <!-- RIGHT SIDE -->

        <div class="right-panel">

            <div class="form-box">

                <h2>Create Your Account</h2>
                <p>Join SkillVerify AI and start your journey</p>

                <form>

                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" placeholder="Enter your full name">
                    </div>

                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" placeholder="Enter your email">
                    </div>

                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" placeholder="Create password">
                    </div>

                    <div class="input-group">
                        <label>Confirm Password</label>
                        <input type="password" placeholder="Confirm password">
                    </div>

                    <div class="input-group">
                        <label>Skill Interest</label>

                        <select>
                            <option>Select your skill</option>
                            <option>Web Development</option>
                            <option>Python</option>
                            <option>Java</option>
                            <option>AI / ML</option>
                        </select>
                    </div>

                    <div class="terms">
                        <label>
                            <input type="checkbox">
                            I agree to Terms & Conditions
                        </label>
                    </div>

                    <button type="submit" class="main-btn">
                        Register
                    </button>

                </form>

                <div class="bottom-text">
                    <p>
                        Already have an account?
                        <a href="login.html">Login here</a>
                    </p>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
